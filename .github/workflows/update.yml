name: Update package

# Bumps package.nix to the latest daisyui-blueprint release on the npm
# registry, verifies the package still builds, and commits directly to main.
# Downstream flakes pick the bump up with a plain `nix flake update`.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Update to latest npm release
        id: update
        run: |
          current=$(nix eval --raw .#daisyui-blueprint.version)
          latest=$(curl -fsSL https://registry.npmjs.org/daisyui-blueprint/latest | jq -r .version)
          echo "current=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nix run nixpkgs#nix-update -- --flake --version "$latest" daisyui-blueprint

          # Refresh deps/ to match the new tarball's runtime dependency set
          # (deps/bun.lock + deps/bun.nix feed the offline bun2nix vendoring).
          # Keep the committed bun.lock: bun reconciles it in place and
          # preserves lockfileVersion 1, which the pinned bun2nix requires
          # (a fresh `bun install` would stamp version 2, which it rejects).
          npm view "daisyui-blueprint@$latest" dependencies --json > /tmp/deps.json || echo '{}' > /tmp/deps.json
          jq -n --arg version "$latest" --slurpfile dependencies /tmp/deps.json \
            '{ name: "daisyui-blueprint", version: $version, type: "module", dependencies: ($dependencies[0] // {}) }' \
            > deps/package.json
          nix shell nixpkgs#bun -c bash -c 'cd deps && bun install'
          nix run github:nix-community/bun2nix/0f2a1f0b6f42cebe3b149bf62d38754c5e0e9729 -- \
            -l deps/bun.lock -o deps/bun.nix

          nix build .#daisyui-blueprint
          {
            echo "changed=true"
            echo "current=$current"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "daisyui-blueprint: ${{ steps.update.outputs.current }} -> ${{ steps.update.outputs.latest }}"
          git push
